<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 畢加索藝術探索</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #ffffff;
        }
        /* 將 iframe 對話窗滿版展開至全螢幕 */
        iframe, .coze-chat-window, div[class*="coze-"] {
            width: 100vw !important;
            height: 100vh !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            border: none !important;
            border-radius: 0 !important;
            z-index: 999999 !important;
        }
    </style>
</head>
<body>
    <script src="https://sf-cdn.coze.com/obj/unpkg-va/flow-platform/chat-app-sdk/1.2.0-beta.6/libs/oversea/index.js"></script>
    <script>
      new CozeWebSDK.WebChatClient({
        config: {
          bot_id: '7683717251153510405',
          isIframe: true
        },
        componentProps: {
          title: 'AI 畢加索',
        },
        ui: {
          asWeb: true
        }
      });
    </script>
</body>
</html>
