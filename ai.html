<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 畢加索藝術探索</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #ffffff;
        }
        /* 將右下角對話框強制拉滿至全螢幕 */
        iframe, .coze-chat-window, div[class*="coze-"] {
            width: 100vw !important;
            height: 100vh !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            border: none !important;
            border-radius: 0 !important;
            max-width: none !important;
            max-height: none !important;
            z-index: 999999 !important;
        }
    </style>
</head>
<body>
    <script src="https://sf-cdn.coze.com/obj/unpkg-va/flow-platform/chat-app-sdk/1.2.0-beta.6/libs/oversea/index.js"></script>
    <script>
      // 替換下方引號內的Token為您剛生成的全新 Token
      const token = 'pat_6o52Vq04augZCSCooQ1PyCvhoCFmf4EtXFJMqWXUo5gbWW1SP6hrYiJ3thXi2oMp';

      const client = new CozeWebSDK.WebChatClient({
        config: {
          bot_id: '7683717251153510405',
        },
        componentProps: {
          title: 'AI 畢加索',
        },
        auth: {
          type: 'token',
          token: token,
          onRefreshToken: function () {
            return token;
          },
          onRefreshTokens: function () {
            return token;
          }
        }
      });

      // 自動觸發開啟對話框
      window.addEventListener('load', () => {
        setTimeout(() => {
          const btn = document.querySelector('div[class*="component"]') || document.querySelector('div[role="button"]');
          if (btn) btn.click();
        }, 800);
      });
    </script>
</body>
</html>
